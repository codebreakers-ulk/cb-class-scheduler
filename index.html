<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Scheduler | Codebreakers</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <div>
        <h1>Class Scheduler</h1>
        <p class="subtitle">Plan weekly lectures, lab blocks, and study periods.</p>
      </div>
      <button id="toggleFormBtn" class="btn btn-primary">+ Add New Class</button>
    </div>
  </header>

  <main class="container main-content">

    <!-- Add Class Form (Hidden by default) -->
    <section id="classFormContainer" class="class-form-container hidden">
      <form id="newClassForm" class="class-form">
        <h3>Schedule a New Class Session</h3>
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="courseName">Course Title</label>
            <input type="text" id="courseName" placeholder="e.g. Usability Engineering" required>
          </div>
          <div class="form-group flex-1">
            <label for="instructorName">Instructor / Lecturer</label>
            <input type="text" id="instructorName" placeholder="e.g. Dr. Mugabo" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="classDay">Day of Week</label>
            <select id="classDay">
              <option value="Monday" selected>Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="startTime">Start Time</label>
            <input type="time" id="startTime" required>
          </div>
          <div class="form-group flex-1">
            <label for="endTime">End Time</label>
            <input type="time" id="endTime" required>
          </div>
          <div class="form-group flex-1">
            <label for="roomNumber">Room / Hall</label>
            <input type="text" id="roomNumber" placeholder="e.g. Lab 4B" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save to Schedule</button>
          <button type="button" id="cancelFormBtn" class="btn btn-outline">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Day Navigation Tabs -->
    <nav class="day-tabs" id="dayTabs">
      <button class="day-tab-btn active" data-day="Monday">Monday</button>
      <button class="day-tab-btn" data-day="Tuesday">Tuesday</button>
      <button class="day-tab-btn" data-day="Wednesday">Wednesday</button>
      <button class="day-tab-btn" data-day="Thursday">Thursday</button>
      <button class="day-tab-btn" data-day="Friday">Friday</button>
      <button class="day-tab-btn" data-day="Saturday">Saturday</button>
      <button class="day-tab-btn" data-day="Sunday">Sunday</button>
      <button class="day-tab-btn" data-day="All">All Days</button>
    </nav>

    <!-- Classes Display Grid -->
    <section class="schedule-section">
      <div class="schedule-header">
        <h2 id="activeDayHeading">Monday's Schedule</h2>
        <span id="classCountBadge" class="count-badge">0 classes</span>
      </div>

      <div id="scheduleGrid" class="schedule-grid">
        <!-- Rendered dynamically from js/app.js -->
      </div>

      <div id="emptySchedule" class="empty-state hidden">
        <p>No classes scheduled for this day. Enjoy your free time or add a study block!</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>Built with Vanilla JS & LocalStorage &bull; Maintained by <strong>Codebreakers</strong></p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
